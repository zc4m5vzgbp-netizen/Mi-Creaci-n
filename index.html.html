<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mi Terminal" />
<meta name="theme-color" content="#0B0E11" />
<title>Mi Terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root {
    --bg: #0B0E11;
    --surface: #12161B;
    --surface-alt: #171C22;
    --hairline: rgba(232, 230, 223, 0.08);
    --paper: #E8E6DF;
    --paper-dim: #8B9099;
    --amber: #D4A954;
    --gain: #3FB68B;
    --loss: #E1615A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--paper); font-family: 'IBM Plex Sans', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .dim { color: var(--paper-dim); }
  .ticker-bar { border-bottom: 1px solid var(--hairline); overflow: hidden; background: #000; padding: 6px 0; white-space: nowrap; }
  .ticker-track { display: inline-flex; animation: scroll 22s linear infinite; }
  @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .ticker-item { font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-right: 28px; }
  .container { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .title { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }
  .subtitle { font-size: 11px; color: var(--amber); letter-spacing: 1px; margin-top: 2px; }
  .gear-btn { background: none; border: none; cursor: pointer; color: var(--paper-dim); font-size: 18px; padding: 4px; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 18px; margin-bottom: 24px; }
  input[type=text] { background: var(--surface-alt); border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 12px; color: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 13px; width: 100%; outline: none; }
  input::placeholder { color: var(--paper-dim); }
  .btn-primary { background: var(--amber); color: #12161B; border: none; border-radius: 8px; padding: 10px 16px; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 13px; cursor: pointer; }
  .btn-primary:disabled { opacity: 0.6; }
  .btn-ghost { background: none; border: none; color: var(--paper-dim); font-size: 13px; cursor: pointer; }
  .search-box { position: relative; margin-bottom: 20px; }
  .search-input-row { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 12px; }
  .search-input-row input { border: none; background: transparent; padding: 0; }
  .search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface-alt); border: 1px solid var(--hairline); border-radius: 8px; margin-top: 4px; overflow-y: auto; max-height: 260px; z-index: 10; }
  .search-result-item { width: 100%; padding: 10px 12px; background: none; border: none; border-bottom: 1px solid var(--hairline); text-align: left; cursor: pointer; color: var(--paper); display: block; }
  .quote-price { font-family: 'IBM Plex Mono', monospace; font-size: 36px; font-weight: 700; line-height: 1.1; }
  .change-tag { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .watchlist-row { width: 100%; padding: 12px 14px; background: none; border: none; border-bottom: 1px solid var(--hairline); cursor: pointer; text-align: left; color: var(--paper); display: flex; align-items: center; justify-content: space-between; }
  .watchlist-row:last-child { border-bottom: none; }
  .watchlist-row.active { background: var(--surface-alt); }
  .italic-note { font-size: 11.5px; color: var(--paper-dim); line-height: 1.5; font-style: italic; margin-top: 28px; }
</style>
</head>
<body>
  <div class="ticker-bar"><div id="tickerTrack" class="ticker-track"><span class="ticker-item dim">conectando…</span></div></div>

  <div class="container">
    <header>
      <div>
        <div class="title">MI TERMINAL</div>
        <div class="subtitle">FASE 1 · PRECIOS EN VIVO (FINNHUB)</div>
      </div>
      <button class="gear-btn" id="gearBtn" style="display:none" aria-label="Configuración">⚙</button>
    </header>

    <div id="settingsPanel" class="card">
      <div class="mono" style="font-weight:700; font-size:16px; margin-bottom:6px;" id="settingsTitle">Conecta tus datos reales</div>
      <div class="dim" style="font-size:13px; margin-bottom:14px; line-height:1.5;">Pega tu clave gratuita de finnhub.io. Se guarda solo en este navegador, en tu iPhone.</div>
      <input type="text" id="keyInput" placeholder="pega tu clave aquí" autocapitalize="off" autocorrect="off" style="margin-bottom:10px;" />
      <div id="keyError" style="color: var(--loss); font-size:12.5px; margin-bottom:10px; display:none;"></div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn-primary" id="saveKeyBtn">Guardar y conectar</button>
        <button class="btn-ghost" id="cancelSettingsBtn" style="display:none;">Cancelar</button>
      </div>
    </div>

    <div id="mainPanel" style="display:none;">
      <div class="search-box">
        <div class="search-input-row">
          <span class="mono" style="color: var(--amber); margin-right:4px;">&gt;</span>
          <input type="text" id="searchInput" placeholder="buscar símbolo (ej. AAPL, TSLA)" />
        </div>
        <div id="searchResults" class="search-results" style="display:none;"></div>
      </div>

      <div class="card" id="quoteCard"></div>

      <div>
        <div class="mono dim" style="font-size:12px; letter-spacing:1px; margin-bottom:8px; text-transform:uppercase;">Mi lista</div>
        <div id="watchlistBox"></div>
      </div>

      <div class="italic-note">Precio y cambio del día: datos reales de Finnhub, en vivo. El gráfico es una trayectoria ilustrativa.</div>
    </div>
  </div>

<script>
  const API_BASE = 'https://finnhub.io/api/v1';
  const state = {
    apiKey: localStorage.getItem('finnhub_api_key') || null,
    watchlist: JSON.parse(localStorage.getItem('watchlist') || '["AAPL","TSLA","NVDA"]'),
    selected: 'AAPL',
    cache: {},
  };

  function escapeHTML(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtPrice(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function seedFromString(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    return h >>> 0;
  }
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function generateHistory(symbol, price, points) {
    points = points || 30;
    const rand = mulberry32(seedFromString(symbol));
    let p = price * 0.945;
    const data = [];
    for (let i = 0; i < points; i++) {
      const drift = (rand() - 0.47) * 0.022;
      p = p * (1 + drift);
      data.push(parseFloat(p.toFixed(2)));
    }
    data[data.length - 1] = price;
    return data;
  }
  function changeTagHTML(pct, abs, big) {
    const up = (pct ?? 0) >= 0;
    const color = up ? 'var(--gain)' : 'var(--loss)';
    const size = big ? '15px' : '12.5px';
    return `<span class="change-tag" style="color:${color}; font-size:${size};">${up?'▲':'▼'} ${up?'+':''}${fmtPrice(abs)} (${up?'+':''}${(pct??0).toFixed(2)}%)</span>`;
  }
  function sparklineSVG(history, up) {
    const min = Math.min.apply(null, history), max = Math.max.apply(null, history);
    const pts = history.map((p, i) => {
      const x = (i / (history.length - 1)) * 300;
      const y = 65 - ((p - min) / (max - min || 1)) * 60;
      return x + ',' + y;
    }).join(' ');
    return `<svg width="100%" height="70" viewBox="0 0 300 70" preserveAspectRatio="none" style="display:block;"><polyline fill="none" stroke="${up ? 'var(--gain)' : 'var(--loss)'}" stroke-width="2" points="${pts}" /></svg>`;
  }

  async function fetchSymbol(symbol) {
    state.cache[symbol] = Object.assign({}, state.cache[symbol], { loading: true, error: null });
    renderQuote(); renderWatchlist(); renderTicker();
    try {
      const results = await Promise.all([
        fetch(`${API_BASE}/quote?symbol=${encodeURIComponent(symbol)}&token=${state.apiKey}`),
        fetch(`${API_BASE}/stock/profile2?symbol=${encodeURIComponent(symbol)}&token=${state.apiKey}`).catch(() => null),
      ]);
      const qRes = results[0], pRes = results[1];
      const q = await qRes.json();
      if (!qRes.ok || q.error) throw new Error(q.error || 'No se pudo obtener el precio');
      if (q.c === 0 && q.pc === 0) throw new Error('Símbolo no encontrado');
      let name = symbol;
      if (pRes && pRes.ok) {
        try { const p = await pRes.json(); if (p && p.name) name = p.name; } catch (e) {}
      }
      state.cache[symbol] = {
        loading: false, error: null, name: name,
        price: q.c, changeAbs: q.d ?? 0, changePct: q.dp ?? 0,
        history: generateHistory(symbol, q.c),
      };
    } catch (e) {
      state.cache[symbol] = Object.assign({}, state.cache[symbol], { loading: false, error: e.message || 'Error de conexión' });
    }
    renderQuote(); renderWatchlist(); renderTicker();
  }

  function toggleWatch(symbol) {
    const has = state.watchlist.includes(symbol);
    state.watchlist = has ? state.watchlist.filter(s => s !== symbol) : state.watchlist.concat([symbol]);
    localStorage.setItem('watchlist', JSON.stringify(state.watchlist));
    if (!has && !state.cache[symbol]) fetchSymbol(symbol);
    else { renderWatchlist(); renderQuote(); }
  }

  function selectSymbol(symbol) {
    state.selected = symbol;
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').style.display = 'none';
    if (!state.cache[symbol] || state.cache[symbol].error) fetchSymbol(symbol);
    else { renderQuote(); renderWatchlist(); }
  }

  function renderTicker() {
    const symbols = Array.from(new Set([state.selected].concat(state.watchlist)));
    const items = symbols.map(s => Object.assign({ symbol: s }, state.cache[s])).filter(c => c && c.price != null);
    const track = document.getElementById('tickerTrack');
    if (items.length === 0) { track.innerHTML = '<span class="ticker-item dim">conectando con el mercado…</span>'; return; }
    const doubled = items.concat(items);
    track.innerHTML = doubled.map(s => `<span class="ticker-item" style="color:${s.changePct>=0?'var(--gain)':'var(--loss)'}"><span class="dim">${s.symbol}</span> ${fmtPrice(s.price)} ${s.changePct>=0?'▲':'▼'} ${(s.changePct??0).toFixed(2)}%</span>`).join('');
  }

  function renderQuote() {
    const s = state.cache[state.selected];
    const card = document.getElementById('quoteCard');
    const inWatch = state.watchlist.includes(state.selected);
    let body;
    if (!s || s.loading) {
      body = '<div class="dim" style="font-size:13px; padding:20px 0;">Cargando cotización…</div>';
    } else if (s.error) {
      body = `<div style="padding:12px 0;"><div style="color:var(--loss); font-size:13px; margin-bottom:8px;">${escapeHTML(s.error)}</div><button class="btn-ghost" style="background:var(--surface-alt); border:1px solid var(--hairline); border-radius:6px; padding:6px 12px;" onclick="fetchSymbol('${state.selected}')">Reintentar</button></div>`;
    } else {
      body = `<div class="quote-price">$${fmtPrice(s.price)}</div><div style="margin:4px 0 14px;">${changeTagHTML(s.changePct, s.changeAbs, true)}</div>${sparklineSVG(s.history, s.changePct >= 0)}<div style="font-size:10.5px; color:var(--paper-dim); margin-top:6px; font-style:italic;">Trayectoria ilustrativa — el precio de hoy sí es real y en vivo.</div>`;
    }
    card.innerHTML = `<div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px;"><div><div class="mono" style="font-weight:700; font-size:22px;">${state.selected}</div><div class="dim" style="font-size:13px;">${s && s.name ? escapeHTML(s.name) : (s && s.loading ? 'Cargando…' : '')}</div></div><div style="display:flex; align-items:center; gap:6px;"><button class="btn-ghost" onclick="fetchSymbol('${state.selected}')" aria-label="Actualizar">🔄</button><button class="btn-ghost" style="font-size:18px; color:${inWatch?'var(--amber)':'var(--paper-dim)'}" onclick="toggleWatch('${state.selected}')" aria-label="Favorito">★</button></div></div>${body}`;
  }

  function renderWatchlist() {
    const box = document.getElementById('watchlistBox');
    if (state.watchlist.length === 0) {
      box.innerHTML = '<div style="border:1px dashed var(--hairline); border-radius:8px; padding:16px; color:var(--paper-dim); font-size:13px;">Toca la estrella de un valor para añadirlo aquí.</div>';
      return;
    }
    box.innerHTML = '<div style="border:1px solid var(--hairline); border-radius:8px; overflow:hidden;">' + state.watchlist.map(sym => {
      const s = state.cache[sym];
      const active = sym === state.selected;
      let right = '';
      if (s && !s.loading && !s.error) {
        right = `<span style="text-align:right;"><div class="mono" style="font-size:13px;">${fmtPrice(s.price)}</div>${changeTagHTML(s.changePct, s.changeAbs)}</span>`;
      }
      const nameLabel = s && s.name ? escapeHTML(s.name) : (s && s.loading ? 'Cargando…' : (s && s.error ? 'Error' : ''));
      return `<button class="watchlist-row ${active?'active':''}" onclick="selectSymbol('${sym}')"><span style="display:flex; align-items:center;"><span style="color:var(--amber); margin-right:10px;">★</span><span><span class="mono" style="font-weight:600; margin-right:8px;">${sym}</span><span class="dim" style="font-size:12.5px;">${nameLabel}</span></span></span>${right}</button>`;
    }).join('') + '</div>';
  }

  let searchTimer = null;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim();
    clearTimeout(searchTimer);
    const resultsBox = document.getElementById('searchResults');
    if (!q) { resultsBox.style.display = 'none'; return; }
    searchTimer = setTimeout(async () => {
      try {
        const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}&token=${state.apiKey}`);
        const data = await res.json();
        const results = (data.result || []).slice(0, 6);
        if (results.length === 0) { resultsBox.style.display = 'none'; return; }
        resultsBox.innerHTML = results.map(r => `<button class="search-result-item" onclick="selectSymbol('${r.symbol}')"><span class="mono" style="font-weight:600; margin-right:8px;">${escapeHTML(r.symbol)}</span><span class="dim" style="font-size:12.5px;">${escapeHTML(r.description)}</span></button>`).join('');
        resultsBox.style.display = 'block';
      } catch (e) { resultsBox.style.display = 'none'; }
    }, 400);
  });

  document.getElementById('saveKeyBtn').addEventListener('click', async () => {
    const input = document.getElementById('keyInput');
    const errBox = document.getElementById('keyError');
    const trimmed = input.value.trim();
    errBox.style.display = 'none';
    if (!trimmed) { errBox.textContent = 'Pega tu clave antes de continuar.'; errBox.style.display = 'block'; return; }
    const btn = document.getElementById('saveKeyBtn');
    btn.textContent = 'Conectando…'; btn.disabled = true;
    try {
      const res = await fetch(`${API_BASE}/quote?symbol=AAPL&token=${trimmed}`);
      const data = await res.json();
      if (!res.ok || data.error || (data.c === 0 && data.pc === 0)) throw new Error('Esa clave no funcionó. Revisa que la copiaste completa, sin espacios.');
      state.apiKey = trimmed;
      localStorage.setItem('finnhub_api_key', trimmed);
      showMain();
      Array.from(new Set([state.selected].concat(state.watchlist))).forEach(fetchSymbol);
    } catch (e) {
      errBox.textContent = e.message || 'No se pudo conectar. Revisa tu clave.';
      errBox.style.display = 'block';
    } finally {
      btn.textContent = 'Guardar y conectar'; btn.disabled = false;
    }
  });

  document.getElementById('gearBtn').addEventListener('click', () => {
    document.getElementById('keyInput').value = state.apiKey || '';
    document.getElementById('settingsTitle').textContent = 'Actualizar tu clave';
    document.getElementById('cancelSettingsBtn').style.display = 'inline-block';
    document.getElementById('settingsPanel').style.display = 'block';
    document.getElementById('mainPanel').style.display = 'none';
  });
  document.getElementById('cancelSettingsBtn').addEventListener('click', () => {
    document.getElementById('settingsPanel').style.display = 'none';
    showMain();
  });

  function showMain() {
    document.getElementById('settingsPanel').style.display = 'none';
    document.getElementById('mainPanel').style.display = 'block';
    document.getElementById('gearBtn').style.display = 'inline-block';
  }

  if (state.apiKey) {
    showMain();
    Array.from(new Set([state.selected].concat(state.watchlist))).forEach(fetchSymbol);
  } else {
    document.getElementById('settingsPanel').style.display = 'block';
  }
</script>
</body>
</html>
